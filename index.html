<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>柔柔大冒險：拯救皮神！</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

    body {
      font-family: 'Zen Maru Gothic', 'Fredoka One', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    /* Custom Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    @keyframes pulse-grow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes bounce-gentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    @keyframes star-pop {
      0% { transform: scale(0) rotate(-45deg); opacity: 0; }
      70% { transform: scale(1.3) rotate(10deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .animate-float { animation: float 4s ease-in-out infinite; }
    .animate-pulse-grow { animation: pulse-grow 2s ease-in-out infinite; }
    .animate-bounce-gentle { animation: bounce-gentle 1.5s ease-in-out infinite; }
    .animate-shake { animation: shake 0.5s ease-in-out; }
    .animate-star { animation: star-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    /* Floating Bubble Styling */
    .bubble {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(0,0,0,0.15), inset 0 4px 8px rgba(255,255,255,0.6);
      transition: transform 0.2s, background-color 0.2s;
    }

    .bubble:active {
      transform: scale(0.9);
    }

    /* Playful Glassmorphism & Cards */
    .game-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 4px solid #ffffff;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.08), 0 8px 0px rgba(0, 0, 0, 0.05);
    }

    .btn-3d {
      transition: all 0.1s ease;
      box-shadow: 0 6px 0px currentColor;
    }

    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0px currentColor;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
